name: woptimize-connector
# Not a site: this project exists only to run the connector's unit tests and
# PHPCS at the client-site floor (PHP 8.1). There is no docroot and no
# database. Real-WordPress integration tests live on `apps/playground`
# (AD-11, AD-18, story 6).
type: php
php_version: "8.1"
webserver_type: nginx-fpm
omit_containers: [db]
# There are no user-generated files here — nothing to exclude from the sync.
disable_upload_dirs_warning: true
# Matches the DDEV >= 1.25 prerequisite in README.md. Stops an older DDEV at
# `ddev start` instead of letting it fail later and confusingly.
ddev_version_constraint: ">= 1.25"
