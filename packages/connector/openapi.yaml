# The connector <-> portal contract (AD-4). Single source of truth for BOTH
# directions. Change this file BEFORE any code, both directions in one PR.
#
# Written 3.0.3-portable on purpose: no `nullable`, no type arrays, no
# `webhooks`, no schema-level `examples`. Story 6 picks the validator library
# and may flip the `openapi:` line below to `3.0.3` without touching anything
# else.
#
# Two directions, two hosts, so every path carries its own `servers` block:
#   - /ping, /status  are hosted by the CONNECTOR, on the client site, under
#     the REST base the connector itself reports (`rest_url('woptimize/v1')`).
#     The portal never builds this URL from the site URL (AD-6).
#   - /phone-home     is hosted by the PORTAL, under /api/connector/v1.
#
# `info.version` is the connector's MAJOR.MINOR. Karin's rule (AD-8): the
# portal supports the current and the previous minor, so a contract change
# needs a minor bump and the connector ships first.
openapi: 3.1.0

info:
  title: WOptimize connector contract
  version: '0.1'
  description: |
    Connector-hosted and portal-hosted endpoints of the WOptimize connector.

    Changes inside `v1` are additive only, on both sides (AD-5). `v2` is a
    major event.

    Auth is one bearer credential in both directions: the portal-issued
    40-character alphanumeric site key, sent in the `X-Woptimize-Site-Key`
    header and compared with `hash_equals()` (AD-5, AD-16). The connector never
    generates or changes a key.

    The connector reports its version in the `X-Woptimize-Connector-Version`
    response header, and in the phone-home body as `SiteReport.connector_version`
    — never in ad-hoc body fields.

    Every remote failure on the connector side degrades to a silent no-op
    (AD-7). A `401` from the portal is permanent-quiet until the next daily
    WP-Cron slot.
  license:
    name: GPL-2.0-or-later
    url: https://www.gnu.org/licenses/gpl-2.0.html

# The two hosts this document describes. Every path overrides this with the
# single server that actually serves it — read the path's own `servers` block,
# never this one.
servers:
  - url: '{rest_base}'
    description: A client WordPress site, served by the connector plugin.
    variables:
      rest_base:
        default: https://example.com/wp-json/woptimize/v1
        description: Value of `rest_url('woptimize/v1')` on the client site.
  - url: '{portal}/api/connector/v1'
    description: The WOptimize portal.
    variables:
      portal:
        default: https://portal.woptimize.io
        description: The connector's `WOPTIMIZE_PORTAL_URL` constant.

security:
  - SiteKey: []

tags:
  - name: connector-hosted
    description: Served by the connector plugin on the client WordPress site.
  - name: portal-hosted
    description: Served by the WOptimize portal.

paths:
  /ping:
    servers:
      - url: '{rest_base}'
        description: >-
          The connector's REST base on the client site. The portal uses the
          value the connector reported as `SiteReport.rest_base`; it never
          derives this URL from the site URL (AD-6).
        variables:
          rest_base:
            default: https://example.com/wp-json/woptimize/v1
            description: Value of `rest_url('woptimize/v1')` on the client site.
    get:
      tags:
        - connector-hosted
      operationId: ping
      summary: Liveness check
      description: >-
        Confirms the site is reachable and the site key is still valid. Carries
        no version in the body — the response header is the channel (AD-5).
      responses:
        '200':
          description: The connector is alive and the key matched.
          headers:
            X-Woptimize-Connector-Version:
              $ref: '#/components/headers/ConnectorVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
              example:
                ok: true
        '401':
          $ref: '#/components/responses/ConnectorUnauthorized'

  /status:
    servers:
      - url: '{rest_base}'
        description: >-
          The connector's REST base on the client site. The portal uses the
          value the connector reported as `SiteReport.rest_base`; it never
          derives this URL from the site URL (AD-6).
        variables:
          rest_base:
            default: https://example.com/wp-json/woptimize/v1
            description: Value of `rest_url('woptimize/v1')` on the client site.
    get:
      tags:
        - connector-hosted
      operationId: status
      summary: Read the site report
      description: >-
        The pull half of the same fact the connector pushes daily to
        `/phone-home`. One `SiteReport` schema serves both.
      responses:
        '200':
          description: The current site report.
          headers:
            X-Woptimize-Connector-Version:
              $ref: '#/components/headers/ConnectorVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteReport'
        '401':
          $ref: '#/components/responses/ConnectorUnauthorized'

  /phone-home:
    servers:
      - url: '{portal}/api/connector/v1'
        description: The WOptimize portal.
        variables:
          portal:
            default: https://portal.woptimize.io
            description: >-
              The connector's `WOPTIMIZE_PORTAL_URL` constant, overridable from
              `wp-config.php`. The playground points it at the local portal.
    post:
      tags:
        - portal-hosted
      operationId: phoneHome
      summary: Report site state to the portal
      description: >-
        Sent daily by WP-Cron, once more right after a key is saved, and once
        after the connector self-updates. The portal updates the registry row
        it already owns; an unknown or invalid key gets a side-effect-free
        `401` and creates nothing (AD-6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteReport'
      responses:
        '200':
          description: The report was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneHomeAck'
              example:
                ok: true
        '401':
          description: >-
            Unknown, invalid, or revoked site key. Side-effect free. The
            connector records it and stays quiet until the next daily slot
            (AD-7).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaravelError'
        '422':
          description: The body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaravelError'
        '5XX':
          description: >-
            The portal is down or broken. The connector queues exactly one
            retry, 15 minutes later, as a single event; that retry records its
            own result and never queues another. A transport error — DNS,
            timeout, TLS — is treated identically (AD-7).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaravelError'

components:
  securitySchemes:
    SiteKey:
      type: apiKey
      in: header
      name: X-Woptimize-Site-Key
      description: >-
        The portal-issued site key: 40 random alphanumeric characters, compared
        with `hash_equals()`. The same credential travels in both directions
        (AD-5, AD-16).

  headers:
    ConnectorVersion:
      description: The connector's semantic version.
      required: true
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'

  responses:
    ConnectorUnauthorized:
      description: >-
        Missing header, empty stored key, or mismatch. The WordPress core REST
        error envelope, never a custom one.
      headers:
        X-Woptimize-Connector-Version:
          $ref: '#/components/headers/ConnectorVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WpRestError'
          example:
            code: woptimize_unauthorized
            message: A valid WOptimize site key is required.
            data:
              status: 401

  # No schema closes itself with `additionalProperties: false`. Karin's rule
  # (AD-8) has the portal serving the current AND the previous connector minor,
  # and the connector ships first — so a reader always has to tolerate fields a
  # newer counterpart added. Closed schemas would turn every additive minor into
  # a breaking change.
  schemas:
    Ping:
      type: object
      description: The whole body of a successful ping.
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum: [true]
          description: >-
            Always `true`. A failure is an error envelope, never `ok: false`.

    PhoneHomeAck:
      type: object
      description: The portal's acknowledgement of a site report.
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum: [true]
          description: >-
            Always `true`. A failure is a Laravel error envelope, never `ok: false`.

    SiteReport:
      type: object
      description: >-
        What one client site reports about itself. Built by one writer in the
        connector and used unchanged as the `/status` response and as the
        `/phone-home` request body.
      required:
        - connector_version
        - site_url
        - home_url
        - rest_base
        - site_name
        - wp_version
        - php_version
        - locale
        - timezone
        - multisite
        - theme
        - updates
      properties:
        connector_version:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
          description: The installed connector version.
        site_url:
          type: string
          format: uri
          description: WordPress `site_url()` — where WordPress core lives.
        home_url:
          type: string
          format: uri
          description: WordPress `home_url()` — the public front page.
        rest_base:
          type: string
          format: uri
          description: >-
            `rest_url('woptimize/v1')`. The only URL the portal may call the
            connector on (AD-6).
        site_name:
          type: string
          description: The site title.
        wp_version:
          type: string
          description: The WordPress core version.
        php_version:
          type: string
          description: The PHP version serving the site.
        locale:
          type: string
          description: The site locale, e.g. `en_US`.
        timezone:
          type: string
          description: >-
            The site timezone: an IANA name such as `Europe/Madrid`, or a UTC
            offset such as `+02:00` when the site is configured that way.
        multisite:
          type: boolean
          description: Whether the site runs as part of a WordPress multisite network.
        theme:
          type: object
          description: The active theme.
          required:
            - slug
            - name
            - version
          properties:
            slug:
              type: string
              description: The stylesheet directory name.
            name:
              type: string
              description: The theme's display name.
            version:
              type: string
              description: The theme's version, or an empty string when it declares none.
        updates:
          type: object
          description: >-
            Pending update counts, read from the `update_core`, `update_plugins`
            and `update_themes` site transients. Zero when WordPress has not
            checked yet.
          required:
            - wordpress
            - plugins
            - themes
          properties:
            wordpress:
              type: integer
              minimum: 0
              description: Core updates offered with response `upgrade`.
            plugins:
              type: integer
              minimum: 0
              description: Plugins with a pending update.
            themes:
              type: integer
              minimum: 0
              description: Themes with a pending update.

    WpRestError:
      type: object
      description: >-
        The WordPress core REST error envelope. Core emits this shape before
        plugin code runs, so the connector never invents its own.
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          description: The machine-readable error code, e.g. `woptimize_unauthorized`.
        message:
          type: string
          description: A human-readable message. Not stable — do not match on it.
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: integer
              description: The HTTP status code.

    LaravelError:
      type: object
      description: Laravel's default JSON error shape.
      required:
        - message
      properties:
        message:
          type: string
          description: A human-readable message.
        errors:
          type: object
          description: >-
            Field name to list of messages. Present on validation failures
            only.
          additionalProperties:
            type: array
            items:
              type: string
