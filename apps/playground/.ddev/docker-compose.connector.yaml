# Mounts the connector plugin folder read-only so the playground can run the
# real code, live from the repo (AD-18). Each DDEV project mounts only its own
# app folder, so `packages/connector` is otherwise invisible from this
# container, and from `wordpress/wp-content/plugins/` it is five levels up —
# outside the mount, where a relative symlink dangles.
#
# The path is relative to `.ddev/`; it lives outside the Mutagen tree, so
# `mutagen.yml` needs no change. It is a directory mount, so an editor that
# renames a file into place does not leave the container on a stale inode.
services:
  web:
    volumes:
      - "../../../packages/connector:/mnt/woptimize/connector:ro"
